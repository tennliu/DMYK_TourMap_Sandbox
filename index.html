<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#910000">
  <title>Dongmen YongKang Guide</title>
  <link rel="stylesheet" href="style.css?v=41">
</head>
<body>
  <div class="app-stage">
    <main class="phone-shell">
      <section id="languageScreen" class="language-screen" aria-label="Language selection">
        <object class="language-bg" data="assets/Language_BG.svg?v=18" type="image/svg+xml" aria-hidden="true" tabindex="-1"></object>
        <img class="language-header" src="assets/Language_Header.svg?v=18" alt="Dongmen YongKang District Touring Guide">
        <div class="language-grid" aria-label="Choose your language">
          <button class="lang-btn lang-cn" data-lang="zh" aria-label="中文"><img src="assets/Lang_CN.svg" alt="中文"></button>
          <button class="lang-btn lang-jp" data-lang="ja" aria-label="日本語"><img src="assets/Lang_JP.svg" alt="日本語"></button>
          <button class="lang-btn lang-en" data-lang="en" aria-label="English"><img src="assets/Lang_EN.svg" alt="English"></button>
          <button class="lang-btn lang-kr" data-lang="ko" aria-label="한국어"><img src="assets/Lang_KR.svg" alt="한국어"></button>
          <button class="lang-btn lang-th" data-lang="th" aria-label="ไทย"><img src="assets/Lang_THAI.svg" alt="ไทย"></button>
          <button class="lang-btn lang-vi" data-lang="vi" aria-label="Tiếng Việt"><img src="assets/Lang_VIET.svg" alt="Tiếng Việt"></button>
          <button class="lang-btn lang-id" data-lang="id" aria-label="Bahasa Indonesia"><img src="assets/Lang_IN.svg" alt="Bahasa Indonesia"></button>
        </div>
        <div class="language-scroll-spacer" aria-hidden="true"></div>
      </section>

      <section id="mapScreen" class="map-screen is-hidden" aria-label="Map">
        <iframe id="mapFrame" class="base-map-frame" title="Dongmen YongKang Map" src="" loading="eager" allowfullscreen></iframe>

        <div id="locationPeekLayer" class="location-peek-layer" aria-hidden="true">
          <iframe id="locationPeekFrame" class="location-peek-frame" title="Current location map" src="" loading="eager"></iframe>
          <div id="locationBeacon" class="location-beacon" aria-hidden="true">
            <span class="location-beacon-pulse" aria-hidden="true"></span>
            <span class="location-beacon-ring location-beacon-ring-a" aria-hidden="true"></span>
            <span class="location-beacon-ring location-beacon-ring-b" aria-hidden="true"></span>
            <span class="location-beacon-dot" aria-hidden="true"></span>
          </div>
        </div>

        <button id="locateBtn" class="locate-btn" type="button" aria-label="我的位置 / Locate Me" aria-pressed="false">
          <span class="locate-icon" aria-hidden="true">◎</span>
          <span id="locateLabel">我在哪</span>
        </button>
        <div id="locationStatus" class="location-status" role="status" aria-live="polite"></div>

        <button id="aiBtn" class="ai-btn" type="button" aria-label="問咚咚 / Ask DongDong">
          <span class="ai-btn-mark" aria-hidden="true">AI</span>
          <span id="aiBtnLabel">問咚咚</span>
        </button>

        <div id="aiBackdrop" class="ai-backdrop" aria-hidden="true"></div>
        <section id="aiPanel" class="ai-panel" aria-hidden="true" aria-label="咚咚 AI">
          <header class="ai-panel-header">
            <div>
              <div class="ai-panel-title"><span id="aiPanelTitle">找地方？問咚咚 ✨</span><span class="ai-version">1.0</span></div>
              <div id="aiModeLabel" class="ai-mode-label">Sandbox Mock · $0 API</div>
            </div>
            <button id="aiCloseBtn" class="ai-close-btn" type="button" aria-label="Close AI">×</button>
          </header>
          <div id="aiMerchantDetail" class="ai-merchant-detail is-hidden" aria-live="polite"></div>
          <div id="aiMessages" class="ai-messages" aria-live="polite"></div>
          <div id="aiQuickPrompts" class="ai-quick-prompts"></div>
          <form id="aiForm" class="ai-form">
            <input id="aiInput" class="ai-input" type="text" maxlength="1200" autocomplete="off" placeholder="想找什麼？" aria-label="Ask DongDong">
            <button id="aiSendBtn" class="ai-send-btn" type="submit">送出</button>
          </form>
        </section>

        <div id="merchantFocusLayer" class="merchant-focus-layer" aria-hidden="true">
          <div id="merchantFocusBeacon" class="merchant-focus-beacon is-hidden" aria-live="polite">
            <div class="merchant-focus-label">
              <div id="merchantFocusName" class="merchant-focus-name"></div>
              <div id="merchantFocusDistance" class="merchant-focus-distance"></div>
              <span class="merchant-focus-pointer" aria-hidden="true"></span>
            </div>
            <span class="merchant-focus-ring merchant-focus-ring-a" aria-hidden="true"></span>
            <span class="merchant-focus-ring merchant-focus-ring-b" aria-hidden="true"></span>
            <span class="merchant-focus-core" aria-hidden="true"></span>
          </div>
          <div id="merchantFocusActions" class="merchant-focus-actions">
            <button id="merchantNavigateBtn" class="merchant-focus-action merchant-focus-action-primary" type="button"><span id="merchantNavigateLabel">導航至店家</span><span id="merchantNavigateDistance" class="merchant-focus-action-distance"></span></button>
            <button id="merchantReturnBtn" class="merchant-focus-action" type="button">回到咚咚</button>
          </div>
        </div>

        <button id="sideBtn" class="side-btn" type="button" aria-label="Open information panel">
          <img src="assets/Side_btn.svg" alt="">
        </button>
      </section>
    </main>
  </div>

  <div id="overlay" class="overlay" aria-hidden="true">
    <img class="overlay-base" src="assets/Overlay_BG.svg" alt="" aria-hidden="true">
    <div class="overlay-inner">
      <img class="overlay-logo" src="assets/Overlay_Logo.svg?v=18" alt="Dongmen YongKang">
      <div class="overlay-content">
        <div id="overlayDescription" class="overlay-description"></div>
        <object class="deco-icon" data="assets/Deco_Icon.svg?v=18" type="image/svg+xml" aria-hidden="true" tabindex="-1"></object>
        <div class="overlay-actions">
          <button id="shareBtn" class="overlay-btn" type="button">分享</button>
          <button id="languageBtn" class="overlay-btn" type="button">選擇語言</button>
          <button id="closeBtn" class="overlay-btn overlay-btn-secondary" type="button">關閉</button>
        </div>
      </div>
    </div>
  </div>

  <script src="data/merchant_catalog.js?v=41"></script>
  <script src="app.js?v=41"></script>
</body>
</html>
